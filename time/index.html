<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ef4444">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Timer">
  <title>Timer | zawato</title>
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
  <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root {
      --bg: #0f1115;
      --fg: #f5f5f5;
      --muted: #8b8f98;
      --track: #262a33;
      --panel: #181b22;
      --green: #22c55e;
      --yellow: #facc15;
      --red: #ef4444;
      --state: var(--red);
      --frame: 14px;
    }
    body[data-state="work"]   { --state: var(--green); }
    body[data-state="buffer"] { --state: var(--yellow); }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* 画面の大枠：状態色 */
    .frame {
      position: fixed;
      inset: 0;
      border: var(--frame) solid var(--state);
      pointer-events: none;
      transition: border-color .2s;
      z-index: 10;
    }

    .app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 3.5dvh, 32px);
      padding: calc(var(--frame) + env(safe-area-inset-top) + 12px) calc(var(--frame) + 16px) calc(var(--frame) + env(safe-area-inset-bottom) + 12px);
    }

    /* 円形メーター */
    .meter {
      position: relative;
      width: min(78vw, 44dvh, 420px);
      aspect-ratio: 1;
    }
    .meter svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .meter circle { fill: none; stroke-width: 8; }
    .track { stroke: var(--track); }
    .progress { stroke: var(--state); stroke-linecap: round; transition: stroke .2s; }
    .readout {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .time {
      font-size: min(17vw, 9.5dvh, 92px);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: .02em;
    }
    .label { font-size: 15px; color: var(--state); font-weight: 600; transition: color .2s; }
    .hint { font-size: 12px; color: var(--muted); min-height: 1em; }

    /* ボタン */
    .buttons { display: flex; gap: 16px; width: min(100%, 420px); }
    .buttons button {
      flex: 1;
      height: 60px;
      border-radius: 14px;
      border: none;
      font: inherit;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
    }
    #reset { background: var(--panel); color: var(--fg); border: 1px solid var(--track); }
    #toggle { background: var(--state); color: #0f1115; transition: background .2s; }
    .buttons button:active { transform: scale(.97); }

    /* 設定 */
    .settings { display: flex; flex-direction: column; gap: 10px; width: min(100%, 420px); }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--panel);
      border-radius: 12px;
      padding: 10px 14px;
    }
    .row span.name { font-size: 15px; color: var(--muted); }
    .fields { display: flex; align-items: center; gap: 6px; font-size: 15px; color: var(--muted); }
    .fields input {
      width: 3.4em;
      height: 40px;
      font: inherit;
      font-size: 18px; /* 16px以上でiOSの自動ズームを防ぐ */
      text-align: center;
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--track);
      border-radius: 8px;
      -moz-appearance: textfield;
    }
    .fields input::-webkit-outer-spin-button,
    .fields input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .fields input:disabled { opacity: .45; }
  </style>
</head>
<body data-state="idle">
  <div class="frame" aria-hidden="true"></div>

  <main class="app">
    <div class="meter">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="45"></circle>
        <circle class="progress" id="progress" cx="50" cy="50" r="45"></circle>
      </svg>
      <div class="readout">
        <div class="time" id="time" role="timer" aria-live="off">00:00</div>
        <div class="label" id="label">停止中</div>
        <div class="hint" id="hint"></div>
      </div>
    </div>

    <div class="buttons">
      <button id="reset" type="button">リセット</button>
      <button id="toggle" type="button">スタート</button>
    </div>

    <div class="settings">
      <label class="row">
        <span class="name">設定時間</span>
        <span class="fields">
          <input id="workMin" type="number" inputmode="numeric" min="0" max="99"> 分
          <input id="workSec" type="number" inputmode="numeric" min="0" max="59"> 秒
        </span>
      </label>
      <label class="row">
        <span class="name">バッファ</span>
        <span class="fields">
          <input id="bufMin" type="number" inputmode="numeric" min="0" max="99"> 分
          <input id="bufSec" type="number" inputmode="numeric" min="0" max="59"> 秒
        </span>
      </label>
    </div>
  </main>

  <script>
  (() => {
    const $ = id => document.getElementById(id);
    const els = {
      time: $('time'), label: $('label'), hint: $('hint'), progress: $('progress'),
      reset: $('reset'), toggle: $('toggle'),
      workMin: $('workMin'), workSec: $('workSec'), bufMin: $('bufMin'), bufSec: $('bufSec'),
      themeColor: document.querySelector('meta[name="theme-color"]'),
    };
    const CIRC = 2 * Math.PI * 45;
    els.progress.style.strokeDasharray = CIRC;

    // ── 設定 ──────────────────────────────────────────────
    const STORAGE_KEY = 'zawato-timer-settings';
    const settings = { work: 60, buffer: 10 }; // 秒
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (saved && saved.work >= 1) settings.work = saved.work;
      if (saved && saved.buffer >= 0) settings.buffer = saved.buffer;
    } catch (_) {}

    const clampInt = (v, lo, hi) => Math.min(hi, Math.max(lo, Math.floor(Number(v) || 0)));

    function fillInputs() {
      els.workMin.value = Math.floor(settings.work / 60);
      els.workSec.value = settings.work % 60;
      els.bufMin.value = Math.floor(settings.buffer / 60);
      els.bufSec.value = settings.buffer % 60;
    }

    function readInputs() {
      const work = clampInt(els.workMin.value, 0, 99) * 60 + clampInt(els.workSec.value, 0, 59);
      const buffer = clampInt(els.bufMin.value, 0, 99) * 60 + clampInt(els.bufSec.value, 0, 59);
      settings.work = Math.max(1, work); // 計測は最低1秒
      settings.buffer = buffer;          // バッファは0秒可
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); } catch (_) {}
      fillInputs();
      if (phase === 'idle') { phaseDur = remaining = settings.work * 1000; render(); }
    }
    [els.workMin, els.workSec, els.bufMin, els.bufSec].forEach(input => {
      input.addEventListener('change', readInputs);
      input.addEventListener('focus', () => input.select());
    });

    // ── 音（Web Audio） ─────────────────────────────────
    let ctx = null;
    let scheduled = [];

    function ensureAudio() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        // iOS のアンロック用に無音を1回鳴らす
        const buf = ctx.createBuffer(1, 1, 22050);
        const src = ctx.createBufferSource();
        src.buffer = buf; src.connect(ctx.destination); src.start(0);
      }
      if (ctx.state === 'suspended') ctx.resume();
    }

    function tone(at, freq, dur, vol) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, at);
      gain.gain.linearRampToValueAtTime(vol, at + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, at + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(at);
      osc.stop(at + dur + 0.02);
      scheduled.push(osc);
      osc.onended = () => { scheduled = scheduled.filter(o => o !== osc); };
    }

    // 計測フェーズの残り5秒カウント＋終了音を、終了時刻から逆算して予約する
    function scheduleWorkSounds() {
      if (!ctx) return;
      const toAudio = perfMs => ctx.currentTime + (perfMs - performance.now()) / 1000;
      const now = ctx.currentTime - 0.02;
      for (let k = 5; k >= 1; k--) {
        const at = toAudio(phaseEnd - k * 1000);
        if (at >= now) tone(Math.max(at, ctx.currentTime), 880, 0.12, 0.5);
      }
      const end = toAudio(phaseEnd);
      if (end >= now) {
        const t = Math.max(end, ctx.currentTime);
        tone(t, 1046.5, 0.25, 0.6);
        tone(t + 0.18, 1568, 0.6, 0.6);
      }
    }

    function cancelSounds() {
      scheduled.forEach(o => { try { o.stop(0); } catch (_) {} });
      scheduled = [];
    }

    // ── 画面スリープ防止 ───────────────────────────────
    let wakeLock = null;
    async function lockScreen() {
      try { if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); }
      catch (_) { wakeLock = null; }
      if (wakeLock) wakeLock.addEventListener('release', () => { wakeLock = null; }, { once: true });
    }
    function unlockScreen() { if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; } }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && running) lockScreen();
    });

    // ── タイマー本体 ──────────────────────────────────
    // phase: 'idle'（開始前）| 'work'（計測）| 'buffer'（バッファ）
    let phase = 'idle';
    let running = false;
    let phaseDur = settings.work * 1000;
    let phaseEnd = 0;                     // performance.now() 基準の終了時刻
    let remaining = settings.work * 1000; // 一時停止中の残り

    function start() {
      ensureAudio();
      if (phase === 'idle') {
        phase = 'work';
        phaseDur = settings.work * 1000;
        remaining = phaseDur;
      }
      running = true;
      phaseEnd = performance.now() + remaining;
      if (phase === 'work') scheduleWorkSounds();
      lockScreen();
      render();
    }

    function pause() {
      remaining = Math.max(0, phaseEnd - performance.now());
      running = false;
      cancelSounds();
      unlockScreen();
      render();
    }

    function reset() {
      running = false;
      phase = 'idle';
      phaseDur = settings.work * 1000;
      remaining = phaseDur;
      cancelSounds();
      unlockScreen();
      render();
    }

    // 終了時刻を連鎖させて進める（setInterval の遅れが積み上がらない）
    function tick() {
      if (!running) return;
      const now = performance.now();
      while (now >= phaseEnd) {
        if (phase === 'work' && settings.buffer > 0) {
          phase = 'buffer';
          phaseDur = settings.buffer * 1000;
        } else {
          phase = 'work';
          phaseDur = settings.work * 1000;
        }
        phaseEnd += phaseDur;
        if (phase === 'work') scheduleWorkSounds();
      }
      remaining = phaseEnd - now;
    }

    function fmt(ms) {
      const s = Math.ceil(ms / 1000);
      return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }

    function render() {
      const state = running ? phase : 'idle';
      document.body.dataset.state = state;
      els.themeColor.content = { work: '#22c55e', buffer: '#facc15', idle: '#ef4444' }[state];

      els.time.textContent = fmt(remaining);
      // 負のオフセットで欠けを12時から時計回りに広げる
      els.progress.style.strokeDashoffset = -CIRC * (1 - Math.min(1, remaining / phaseDur));

      if (running) els.label.textContent = phase === 'work' ? '計測中' : 'バッファ';
      else els.label.textContent = phase === 'idle' ? '停止中' : '一時停止';
      els.hint.textContent = running ? 'タップで一時停止' : '';

      els.toggle.textContent = running ? 'ストップ' : (phase === 'idle' ? 'スタート' : '再開');
      const locked = phase !== 'idle';
      [els.workMin, els.workSec, els.bufMin, els.bufSec].forEach(i => { i.disabled = locked; });
    }

    function loop() { tick(); if (running) render(); requestAnimationFrame(loop); }
    setInterval(tick, 200); // 非表示タブでも状態を進める

    // ── 操作 ─────────────────────────────────────────
    els.toggle.addEventListener('click', () => (running ? pause() : start()));
    els.reset.addEventListener('click', reset);

    // 実行中は画面のどこを触っても一時停止（再開はボタンだけ）
    document.addEventListener('pointerdown', e => {
      if (running && !e.target.closest('button')) pause();
    });

    // PC用：スペースキーでスタート/ストップ
    document.addEventListener('keydown', e => {
      if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
        e.preventDefault();
        running ? pause() : start();
      }
    });

    fillInputs();
    render();
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
