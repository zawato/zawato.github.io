<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="zawato - データサイエンス・プログラミング・資格">
  <title>zawato</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- Canvas for particle effect -->
  <canvas id="particles-canvas"></canvas>

  <!-- Dark mode toggle -->
  <button class="theme-toggle" id="themeToggle" aria-label="テーマ切替">
    <i class="fas fa-moon"></i>
  </button>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <div class="avatar-wrapper">
        <div class="avatar">
          <i class="fas fa-user-astronaut"></i>
        </div>
        <div class="avatar-ring"></div>
      </div>
      <h1 class="hero-title">zawato</h1>
      <p class="hero-subtitle">
        <span class="typed-text" id="typedText"></span><span class="cursor">|</span>
      </p>
      <div class="hero-badges">
        <span class="badge"><i class="fas fa-chart-line"></i> Data Science</span>
        <span class="badge"><i class="fas fa-code"></i> Programming</span>
        <span class="badge"><i class="fas fa-certificate"></i> Certification</span>
      </div>
      <div class="hero-cta">
        <a href="my-link/" class="btn btn-primary">
          <i class="fas fa-link"></i> リンク集を見る
        </a>
        <a href="https://zawato.jp" class="btn btn-secondary" target="_blank" rel="noopener noreferrer">
          <i class="fas fa-external-link-alt"></i> ブログへ
        </a>
      </div>
    </div>
    <div class="scroll-indicator">
      <div class="scroll-dot"></div>
    </div>
  </section>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Stats Section -->
    <section class="stats-section">
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-pen-nib"></i></div>
        <div class="stat-value" data-target="50">0</div>
        <div class="stat-label">記事</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fab fa-github"></i></div>
        <div class="stat-value" data-target="30">0</div>
        <div class="stat-label">リポジトリ</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-star"></i></div>
        <div class="stat-value" data-target="5">0</div>
        <div class="stat-label">年の経験</div>
      </div>
    </section>

    <!-- Content Section -->
    <section class="category-section">
      <h2 class="section-title">
        <span class="section-title-text">コンテンツ</span>
      </h2>
      <div class="links-grid">
        <!-- Link Collection -->
        <a href="my-link/" class="link-card featured">
          <div class="card-bg"></div>
          <div class="link-icon">
            <i class="fas fa-layer-group"></i>
          </div>
          <div class="link-content">
            <h3 class="link-title">リンク集</h3>
            <p class="link-description">SNS、ブログ、プロジェクトへのリンクをまとめています</p>
          </div>
          <div class="link-arrow">
            <i class="fas fa-arrow-right"></i>
          </div>
          <div class="card-shine"></div>
        </a>

        <!-- Main Blog -->
        <a href="https://zawato.jp" class="link-card" target="_blank" rel="noopener noreferrer">
          <div class="card-bg"></div>
          <div class="link-icon">
            <i class="fas fa-blog"></i>
          </div>
          <div class="link-content">
            <h3 class="link-title">zawato.jp</h3>
            <p class="link-description">メインブログ - データサイエンス、プログラミング、資格</p>
          </div>
          <div class="link-arrow">
            <i class="fas fa-arrow-right"></i>
          </div>
          <div class="card-shine"></div>
        </a>

        <!-- GitHub -->
        <a href="https://github.com/zawato" class="link-card" target="_blank" rel="noopener noreferrer">
          <div class="card-bg"></div>
          <div class="link-icon">
            <i class="fab fa-github"></i>
          </div>
          <div class="link-content">
            <h3 class="link-title">GitHub</h3>
            <p class="link-description">オープンソースプロジェクトやコードサンプル</p>
          </div>
          <div class="link-arrow">
            <i class="fas fa-arrow-right"></i>
          </div>
          <div class="card-shine"></div>
        </a>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <p class="footer-brand">zawato</p>
      <p class="footer-copy">&copy; 2026 zawato. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>

</html>
