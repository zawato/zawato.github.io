  <script>
    // タグ絞り込み（一覧ページのみ動く。対象がなければ何もしない）
    (function () {
      var chips = document.querySelectorAll('.zk-chip');
      if (!chips.length) return;

      var cards = Array.prototype.slice.call(document.querySelectorAll('.zk-card'));
      var blocks = Array.prototype.slice.call(document.querySelectorAll('.zk-chapter-block'));
      var empty = document.querySelector('.zk-empty');

      function apply(tag) {
        var shown = 0;
        cards.forEach(function (card) {
          var tags = (card.dataset.tags || '').split(/\s+/);
          var hit = !tag || tags.indexOf(tag) !== -1;
          card.hidden = !hit;
          if (hit) shown++;
        });
        blocks.forEach(function (block) {
          var visible = block.querySelectorAll('.zk-card:not([hidden])').length;
          block.hidden = visible === 0;
        });
        if (empty) empty.hidden = shown !== 0;
      }

      chips.forEach(function (chip) {
        chip.addEventListener('click', function () {
          chips.forEach(function (other) {
            other.setAttribute('aria-pressed', String(other === chip));
          });
          apply(chip.dataset.tag || '');
        });
      });
    })();
  </script>
